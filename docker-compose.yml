services:
  clamav-maldet:
    build: .
    container_name: clamav-maldet
    environment:
      - SCAN_TIME=0 2 * * *
      - SCAN_PATH=/scan
      - SCAN_MAX_FILESIZE=500m
    volumes:
      - /path/to/your/data:/scan:ro
      - /path/to/quarantine:/usr/local/maldetect/quarantine
    ports:
      - "8888:8888"
