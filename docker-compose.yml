services:
  clamav-maldet:
    image: ${REGISTRY}/thirtysomething/clamav-maldet:latest
    container_name: clamav-maldet
    environment:
      SCAN_MAX_FILESIZE: ${SCAN_MAX_FILESIZE}
      SCAN_PATH: ${SCAN_PATH}
      SCAN_TIME: ${SCAN_TIME}
      TZ: ${TZ}
      UPDATE_TIME: ${UPDATE_TIME}
    volumes:
      - ${SCAN_HOST_PATH}:/scan
      - ${QUARANTINE_HOST_PATH}:/usr/local/maldetect/quarantine
    ports:
      - "${HOST_PORT}:8888"
